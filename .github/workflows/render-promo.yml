name: Render Video Promo Alterlist

# Hasil: SATU file MP4 (1080x1920, 30 fps, 23 detik) dipublikasikan ke halaman Releases repo.
# Cara pakai lewat GitHub Web:
#   1. Upload alterlist-promo.zip ke root repo (Add file > Upload files).
#   2. Buat file ini di .github/workflows/render-promo.yml.
#   3. Tab Actions > "Render Video Promo Alterlist" > Run workflow.
# ZIP hanya diekstrak di runner (tidak ada commit), jadi repo tetap bersih.

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Lokasi ZIP proyek di repo"
        required: true
        default: "alterlist-promo.zip"
  push:
    branches: ["main", "master"]
    paths:
      - "alterlist-promo.zip"
      - ".github/workflows/render-promo.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render video dan rilis MP4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZIP_PATH: ${{ inputs.zip_path || 'alterlist-promo.zip' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ekstrak ZIP proyek
        run: |
          set -e
          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP '$ZIP_PATH' tidak ditemukan di repo. Upload dulu ke root repo."
            ls -la
            exit 1
          fi
          DEST="$RUNNER_TEMP/promo-src"
          rm -rf "$DEST" && mkdir -p "$DEST"
          unzip -q -o "$ZIP_PATH" -d "$DEST"
          PKG=$(find "$DEST" -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG" ]; then
            echo "::error::package.json tidak ada di dalam ZIP."
            exit 1
          fi
          echo "PROMO_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"
          echo "Proyek: $(dirname "$PKG")"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pasang pustaka sistem untuk Chromium (Remotion)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Pasang dependensi npm
        run: |
          cd "$PROMO_DIR"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Siapkan browser Remotion
        run: |
          cd "$PROMO_DIR"
          npx remotion browser ensure || true

      - name: Render video
        run: |
          cd "$PROMO_DIR"
          npx remotion render src/index.ts AlterlistPromo out/alterlist-promo.mp4 \
            --codec=h264 --crf=17 --pixel-format=yuv420p

      - name: Periksa hasil
        run: |
          cd "$PROMO_DIR"
          ls -lh out
          SIZE=$(stat -c %s out/alterlist-promo.mp4)
          if [ "$SIZE" -lt 200000 ]; then
            echo "::error::File MP4 terlalu kecil ($SIZE byte), render kemungkinan gagal."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp out/alterlist-promo.mp4 "$GITHUB_WORKSPACE/dist/Alterlist-Promo.mp4"

      - name: Simpan sebagai artifact (cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: Alterlist-Promo-MP4
          path: dist/Alterlist-Promo.mp4

      - name: Publikasikan ke Releases
        run: |
          TAG="promo-${{ github.run_number }}"
          gh release create "$TAG" "dist/Alterlist-Promo.mp4" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Alterlist Promo #${{ github.run_number }}" \
            --notes "Video promo Alterlist 1080x1920 30fps 23 detik (lagu isq - crimes). Credit by eliojioDev."
            
